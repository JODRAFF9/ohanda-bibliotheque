name: Compiler l'exécutable Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/build-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Compiler
        run: >
          pyinstaller --noconsole --onefile --name TauxOANDA
          --hidden-import matplotlib.backends.backend_tkagg
          app/main.py
      - name: Publier l'exécutable
        uses: actions/upload-artifact@v4
        with:
          name: TauxOANDA-windows
          path: dist/TauxOANDA.exe
          if-no-files-found: error
